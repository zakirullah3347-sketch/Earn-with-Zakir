<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakir Website</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  background: linear-gradient(to bottom, #000, #111);
  color: white;
  font-family: Arial;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: yellow;
}

.menu-icon {
  font-size: 25px;
  cursor: pointer;
}

/* SIDE MENU */
.side-menu {
  position: fixed;
  top: 0;
  left: -260px;
  width: 260px;
  height: 100%;
  background: #111;
  padding: 20px;
  transition: 0.3s;
  z-index: 1000;
}

.side-menu a {
  display: block;
  padding: 12px 0;
  color: white;
  text-decoration: none;
  border-bottom: 1px solid #222;
}

/* HERO */
.hero {
  min-height: 90vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* IMAGE */
.hero img {
  width: 140px;
  border-radius: 50%;
  box-shadow: 0 0 25px yellow;
  margin: 15px 0;
}

/* TEXT */
h1 {
  color: yellow;
  font-size: 28px;
  margin-bottom: 5px;
}

h2 {
  color: #ccc;
  font-size: 18px;
  margin-bottom: 10px;
}

p {
  color: #aaa;
  font-size: 14px;
  max-width: 500px;
  margin-bottom: 10px;
}

/* BUTTONS */
.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

button {
  background: yellow;
  color: black;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: black;
  color: yellow;
  box-shadow: 0 0 15px yellow;
}

/* DESKTOP FIX */
@media (min-width: 768px) {
  h1 { font-size: 36px; }
  h2 { font-size: 22px; }
  p { font-size: 16px; }
}

</style>
</head>

<body>

<!-- SIDE MENU -->
<div class="side-menu" id="menu">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="fiver.html">Fiverr</a>
  <a href="contact.html">Contact</a>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">Zakir</div>
  <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<!-- HERO -->
<div class="hero">

  <h1>Hi, I'm Zakir 👋</h1>
  <h2>Digital Creator & Adobe Stock Contributor</h2>

  <img src="myphoto.jpg">

  <p>Helping people learn online earning 🚀</p>

  <div class="buttons">

    <a href="https://stock.adobe.com" target="_blank">
      <button>Adobe Portfolio</button>
    </a>

    <button onclick="window.location.href='fiver.html'">Fiverr</button>
    <button onclick="window.location.href='about.html'">About</button>
    <button onclick="window.location.href='privacy.html'">Privacy</button>
    <button onclick="window.location.href='contact.html'">Contact</button>

  </div>

</div>

<!-- SCRIPT -->
<script>
function toggleMenu() {
  let menu = document.getElementById("menu");
  if (menu.style.left === "0px") {
    menu.style.left = "-260px";
  } else {
    menu.style.left = "0px";
  }
}
</script>

</body>
</html>
