<!DOCTYPE html>
<html>
<head>
<title>Zakir Website</title>

<style>

/* BODY */
body {
  margin: 0;
  background-color: black;
  color: white;
  font-family: Arial;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}

.menu-icon {
  font-size: 25px;
  cursor: pointer;
}

/* SIDE MENU */
.side-menu {
  position: fixed;
  top: 0;
  left: -250px;
  width: 250px;
  height: 100%;
  background: #111;
  padding: 20px;
  transition: 0.3s;
}

.side-menu a {
  display: block;
  color: white;
  padding: 12px 0;
  text-decoration: none;
}

/* HERO */
.hero {
  text-align: center;
  padding: 30px;
}

/* IMAGE */
img {
  width: 150px;
  border-radius: 50%;
  box-shadow: 0 0 20px yellow;
  margin-top: 20px;
}

/* TEXT */
h1 {
  color: yellow;
}

h2 {
  color: #ddd;
}

p {
  color: #bbb;
  max-width: 600px;
  margin: auto;
}

/* BUTTONS */
.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

button {
  background: yellow;
  color: black;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
}

button:hover {
  background: black;
  color: yellow;
  box-shadow: 0 0 10px yellow;
}

</style>

</head>

<body>

<!-- SIDE MENU -->
<div class="side-menu" id="menu">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="fiver.html">Fiverr</a>
  <a href="contact.html">Contact</a>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <h2>Zakir</h2>
  <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<!-- HERO SECTION -->
<div class="hero">

  <h1>Hi, I'm Zakir 👋</h1>
  <h2>Digital Creator & Adobe Stock Contributor</h2>

  <img src="myphoto.jpg">

  <p>I create stock images and design digital content</p>
  <p>Welcome to my website. Here I share my work and help people learn online earning.</p>

  <div class="buttons">

    <a href="https://stock.adobe.com" target="_blank">
      <button>Adobe Portfolio</button>
    </a>

    <button onclick="window.location.href='fiver.html'">Fiverr</button>
    <button onclick="window.location.href='about.html'">About</button>
    <button onclick="window.location.href='privacy.html'">Privacy</button>
    <button onclick="window.location.href='contact.html'">Contact</button>

  </div>

</div>

<!-- SCRIPT -->
<script>
function toggleMenu() {
  let menu = document.getElementById("menu");
  if (menu.style.left === "0px") {
    menu.style.left = "-250px";
  } else {
    menu.style.left = "0px";
  }
}
</script>

</body>
</html>
